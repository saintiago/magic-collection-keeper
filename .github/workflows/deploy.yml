name: Test and deploy Keeper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keeper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-build
          path: |
            public/
            build/cloud.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keeper-build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Write public configuration
        env:
          API_URL: ${{ vars.API_URL }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
        run: node -e "require('fs').writeFileSync('public/config.json',JSON.stringify({region:'us-east-1',apiUrl:process.env.API_URL,clientId:process.env.CLIENT_ID}))"
      - name: Deploy API
        run: |
          cd build
          zip ../cloud.zip cloud.mjs
          aws lambda update-function-code --function-name magic-collection-keeper --zip-file fileb://../cloud.zip > /dev/null
          aws lambda wait function-updated --function-name magic-collection-keeper
      - name: Deploy website
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
          DISTRIBUTION: ${{ vars.DISTRIBUTION_ID }}
        run: |
          aws s3 sync public/ "s3://$BUCKET/" --delete --cache-control 'public,max-age=300' --no-progress
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$INVALIDATION"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify protected deployed app
        env:
          LIVE_URL: ${{ vars.WEBSITE_URL }}
          KEEPER_TEST_USER: ${{ secrets.KEEPER_TEST_USER }}
          KEEPER_TEST_PASSWORD: ${{ secrets.KEEPER_TEST_PASSWORD }}
          KEEPER_OTHER_USER: ${{ secrets.KEEPER_OTHER_USER }}
          KEEPER_OTHER_PASSWORD: ${{ secrets.KEEPER_OTHER_PASSWORD }}
        run: npx playwright test --config playwright.live.config.js
