name: Diagnose rendered return frames
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  return-frames:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: bash scripts/install-ci-browsers.sh
      - run: npx playwright test -c tests/prototype/playwright.config.mjs tests/prototype/return.spec.js --project=webkit --repeat-each=5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-frame-diagnostics
          path: test-results/
