name: Test and deploy Keeper
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keeper-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node scripts/build-name-index.mjs
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build verified browser recognition assets
        run: |
          pip install -r recognition/requirements-visual.txt
          python recognition/scripts/prepare.py --visual-only
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:ui
      - name: Verify WebKit autocomplete touch
        run: npx playwright test tests/ui/discovery.spec.js tests/ui/home.spec.js tests/ui/hybrid-search.spec.js tests/ui/card-page.spec.js tests/ui/scan-wheel-photo.spec.js --browser=webkit --workers=1
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-build
          path: |
            public/
            build/cloud.mjs
            build/catalog/
  deploy:
    concurrency:
      group: keeper-catalog-publication
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keeper-build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Write public configuration
        env:
          API_URL: ${{ vars.API_URL }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          BACKEND_RECOGNITION: ${{ vars.BACKEND_RECOGNITION }}
        run: node -e "require('fs').writeFileSync('public/config.json',JSON.stringify({region:'us-east-1',apiUrl:process.env.API_URL,clientId:process.env.CLIENT_ID,backendRecognition:process.env.BACKEND_RECOGNITION==='true'}))"
      - name: Prepare unique deployment
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
        run: |
          aws s3 cp "s3://$BUCKET/index.html" build/previous-index.html --no-progress
          node scripts/prepare-release.mjs
      - name: Deploy API
        run: |
          cd build
          zip ../cloud.zip cloud.mjs catalog/current.json catalog/*.server.gz
          aws lambda update-function-code --function-name magic-collection-keeper --zip-file fileb://../cloud.zip > /dev/null
          aws lambda wait function-updated --function-name magic-collection-keeper
      - name: Publish multilingual card names
        run: node scripts/publish-name-index.mjs
        env:
          WEBSITE_BUCKET: ${{ vars.WEBSITE_BUCKET }}
      - name: Deploy website
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
          DISTRIBUTION: ${{ vars.DISTRIBUTION_ID }}
        run: |
          RELEASE_ID=$(node -p "JSON.parse(require('fs').readFileSync('build/release.json')).id")
          aws s3 sync "build/site/releases/$RELEASE_ID/" "s3://$BUCKET/releases/$RELEASE_ID/" --cache-control 'public,max-age=31536000,immutable' --no-progress
          aws s3 cp public/config.json "s3://$BUCKET/config.json" --cache-control 'no-cache,no-store,must-revalidate' --content-type application/json --no-progress
          aws s3 cp build/site/index.html "s3://$BUCKET/index.html" --cache-control 'no-cache,no-store,must-revalidate' --content-type text/html --no-progress
          INVALIDATION=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$INVALIDATION"
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify protected deployed app
        env:
          LIVE_URL: ${{ vars.WEBSITE_URL }}
          KEEPER_TEST_USER: ${{ secrets.KEEPER_TEST_USER }}
          KEEPER_TEST_PASSWORD: ${{ secrets.KEEPER_TEST_PASSWORD }}
          KEEPER_OTHER_USER: ${{ secrets.KEEPER_OTHER_USER }}
          KEEPER_OTHER_PASSWORD: ${{ secrets.KEEPER_OTHER_PASSWORD }}
          KEEPER_TAGS_USER: ${{ secrets.KEEPER_TAGS_USER }}
          KEEPER_TAGS_PASSWORD: ${{ secrets.KEEPER_TAGS_PASSWORD }}
          KEEPER_IMPORT_USER: ${{ secrets.KEEPER_IMPORT_USER }}
          KEEPER_IMPORT_PASSWORD: ${{ secrets.KEEPER_IMPORT_PASSWORD }}
        run: |
          npx playwright test --config playwright.live.config.js
          npx playwright test --config playwright.mobile-live.config.js
