name: Verify a published Keeper release
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact commit of the already published frontend
        required: true
      expected_release:
        description: Exact published release ID, such as r103-a1
        required: true
permissions:
  contents: read
concurrency:
  group: keeper-live-verification
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: keeper-catalog-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Install verified Playwright browsers and dependencies
        run: bash scripts/install-ci-browsers.sh
      - id: identity
        name: Require the exact published release before using reserved profiles
        env:
          LIVE_URL: ${{ vars.WEBSITE_URL }}
          KEEPER_VERIFY_COMMIT: ${{ inputs.expected_commit }}
          KEEPER_VERIFY_RELEASE: ${{ inputs.expected_release }}
          RECOGNITION_SOURCE_SHA256: ${{ vars.RECOGNITION_SOURCE_SHA256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { writeFile } from 'node:fs/promises';
          import { execFileSync } from 'node:child_process';
          const { LIVE_URL: origin, KEEPER_VERIFY_COMMIT: commit, KEEPER_VERIFY_RELEASE: id, RECOGNITION_SOURCE_SHA256: source } = process.env;
          assert.match(commit, /^[a-f0-9]{40}$/);
          assert.match(id, /^r[1-9]\d*-a[1-9]\d*$/);
          assert.match(source, /^[a-f0-9]{64}$/);
          execFileSync('git', ['merge-base', '--is-ancestor', commit, 'HEAD']);
          const read = async path => {
            const result = await fetch(new URL(path, origin), { cache: 'no-store', signal: AbortSignal.timeout(30000) });
            assert.ok(result.ok);
            return result;
          };
          const html = await (await read('/')).text();
          assert.equal(/name="keeper-release" content="([^"]+)"/.exec(html)?.[1], id);
          const metadata = await (await read('/releases/' + id + '/version.json')).json();
          assert.equal(metadata.commit, commit);
          assert.equal(metadata.id, id);
          assert.equal(metadata.recognition.sourceSha256, source);
          await writeFile('verified-published-release.json', JSON.stringify(metadata, null, 2));
          console.log(JSON.stringify({ exactPublishedCommit: commit, exactPublishedRelease: id }));
          JS
      - name: Verify deployed desktop controls and persistence
        env:
          LIVE_URL: ${{ vars.WEBSITE_URL }}
          KEEPER_VERIFY_COMMIT: ${{ inputs.expected_commit }}
          KEEPER_VERIFY_RELEASE: ${{ inputs.expected_release }}
          RECOGNITION_SOURCE_SHA256: ${{ vars.RECOGNITION_SOURCE_SHA256 }}
          KEEPER_TEST_USER: ${{ secrets.KEEPER_TEST_USER }}
          KEEPER_TEST_PASSWORD: ${{ secrets.KEEPER_TEST_PASSWORD }}
          KEEPER_OTHER_USER: ${{ secrets.KEEPER_OTHER_USER }}
          KEEPER_OTHER_PASSWORD: ${{ secrets.KEEPER_OTHER_PASSWORD }}
          KEEPER_TAGS_USER: ${{ secrets.KEEPER_TAGS_USER }}
          KEEPER_TAGS_PASSWORD: ${{ secrets.KEEPER_TAGS_PASSWORD }}
          KEEPER_IMPORT_USER: ${{ secrets.KEEPER_IMPORT_USER }}
          KEEPER_IMPORT_PASSWORD: ${{ secrets.KEEPER_IMPORT_PASSWORD }}
        run: npx playwright test --config playwright.live.config.js --output live-desktop-results
      - name: Verify deployed mobile controls and persistence
        if: ${{ !cancelled() && steps.identity.outcome == 'success' }}
        env:
          LIVE_URL: ${{ vars.WEBSITE_URL }}
          KEEPER_VERIFY_COMMIT: ${{ inputs.expected_commit }}
          KEEPER_VERIFY_RELEASE: ${{ inputs.expected_release }}
          RECOGNITION_SOURCE_SHA256: ${{ vars.RECOGNITION_SOURCE_SHA256 }}
          KEEPER_TEST_USER: ${{ secrets.KEEPER_TEST_USER }}
          KEEPER_TEST_PASSWORD: ${{ secrets.KEEPER_TEST_PASSWORD }}
          KEEPER_OTHER_USER: ${{ secrets.KEEPER_OTHER_USER }}
          KEEPER_OTHER_PASSWORD: ${{ secrets.KEEPER_OTHER_PASSWORD }}
          KEEPER_TAGS_USER: ${{ secrets.KEEPER_TAGS_USER }}
          KEEPER_TAGS_PASSWORD: ${{ secrets.KEEPER_TAGS_PASSWORD }}
          KEEPER_IMPORT_USER: ${{ secrets.KEEPER_IMPORT_USER }}
          KEEPER_IMPORT_PASSWORD: ${{ secrets.KEEPER_IMPORT_PASSWORD }}
        run: npx playwright test --config playwright.mobile-live.config.js --output live-mobile-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          retention-days: 1
          name: published-release-verification
          path: |
            verified-published-release.json
            live-desktop-results/**/live-wheel-*.png
            live-desktop-results/**/live-owned-inspector-*.png
            live-mobile-results/**/live-wheel-*.png
            live-mobile-results/**/live-owned-inspector-*.png
