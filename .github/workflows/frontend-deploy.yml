name: Verify and deploy frontend only
on:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: keeper-release-plan
          path: build
      - run: npm ci
      - name: Restore checksum-verified immutable browser assets
        env:
          WEBSITE_URL: ${{ vars.WEBSITE_URL }}
        run: node scripts/restore-release-assets.mjs
      - run: npm test
      - name: Install verified Playwright browsers and dependencies
        run: bash scripts/install-ci-browsers.sh
      - name: Verify frontend controls, failure paths and both browser engines
        run: node scripts/frontend-checks.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: keeper-frontend-build
          path: |
            public/
            !public/vendor/**
            build/release-plan.json
  frontend-publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: frontend-test
    concurrency:
      group: keeper-catalog-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: keeper-frontend-build
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Prepare frontend against the locked publication base
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
          API_URL: ${{ vars.API_URL }}
          CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          BACKEND_RECOGNITION: ${{ vars.BACKEND_RECOGNITION }}
        run: |
          node -e "require('fs').writeFileSync('public/config.json',JSON.stringify({region:'us-east-1',apiUrl:process.env.API_URL,clientId:process.env.CLIENT_ID,backendRecognition:process.env.BACKEND_RECOGNITION==='true'}))"
          aws s3 cp "s3://$BUCKET/index.html" build/previous-index.html --no-progress
          node scripts/prepare-release.mjs
      - name: Verify live backend and source compatibility
        env:
          KEEPER_TEST_USER: ${{ secrets.KEEPER_TEST_USER }}
          KEEPER_TEST_PASSWORD: ${{ secrets.KEEPER_TEST_PASSWORD }}
        run: |
          aws lambda get-function-configuration --function-name magic-collection-keeper --query '{CodeSha256:CodeSha256,LastUpdateStatus:LastUpdateStatus}' > build/lambda-identity.json
          node scripts/verify-release-backend.mjs frontend
          node scripts/prepare-release.mjs --package
      - name: Install verified Playwright browsers and dependencies
        run: bash scripts/install-ci-browsers.sh
      - name: Publish frontend without backend or model updates
        id: publish
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
          DISTRIBUTION: ${{ vars.DISTRIBUTION_ID }}
        run: node scripts/publish-frontend.mjs
      - name: Verify the deployed frontend with reserved profiles
        env:
          RECOGNITION_SOURCE_SHA256: ${{ vars.RECOGNITION_SOURCE_SHA256 }}
          LIVE_URL: ${{ vars.WEBSITE_URL }}
          KEEPER_TEST_USER: ${{ secrets.KEEPER_TEST_USER }}
          KEEPER_TEST_PASSWORD: ${{ secrets.KEEPER_TEST_PASSWORD }}
          KEEPER_OTHER_USER: ${{ secrets.KEEPER_OTHER_USER }}
          KEEPER_OTHER_PASSWORD: ${{ secrets.KEEPER_OTHER_PASSWORD }}
          KEEPER_TAGS_USER: ${{ secrets.KEEPER_TAGS_USER }}
          KEEPER_TAGS_PASSWORD: ${{ secrets.KEEPER_TAGS_PASSWORD }}
          KEEPER_IMPORT_USER: ${{ secrets.KEEPER_IMPORT_USER }}
          KEEPER_IMPORT_PASSWORD: ${{ secrets.KEEPER_IMPORT_PASSWORD }}
        run: |
          npx playwright test --config playwright.live.config.js tests/live/deployment.spec.js tests/live/release.spec.js tests/live/discovery.spec.js tests/live/card-actions.spec.js
          npx playwright test --config playwright.mobile-live.config.js tests/mobile-live/home.spec.js tests/mobile-live/card-actions.spec.js
      - name: Restore the verified previous frontend if publication checks fail
        if: failure() && steps.publish.outputs.published == 'true'
        env:
          BUCKET: ${{ vars.WEBSITE_BUCKET }}
          DISTRIBUTION: ${{ vars.DISTRIBUTION_ID }}
        run: node scripts/publish-frontend.mjs --rollback
      - name: Record release identities
        if: always()
        run: |
          node -e "const fs=require('fs');if(fs.existsSync('build/release.json')){const r=JSON.parse(fs.readFileSync('build/release.json'));fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Frontend '+r.version+' ('+r.commit+')\n\nReused API '+r.api.version+' ('+r.api.commit+')\n\nReused asset release '+r.assets.id+'\n');}"
