name: Verify isolated recognition container
on:
  workflow_dispatch:
  push:
    branches: [codex/collectorvision-service]
    paths: ["recognition/**", ".github/workflows/recognition.yml"]
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  recognition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install -r recognition/requirements-linux.txt
      - run: PYTHONPATH=recognition python -m unittest discover -s recognition/tests -v
      - run: node --test tests/backend-recognition.test.js
      - run: python recognition/scripts/prepare.py
      - name: Convert frozen OCR weights in a separate build environment
        run: |
          python -m venv /tmp/keeper-converter
          /tmp/keeper-converter/bin/pip install -r recognition/requirements-converter.txt
          /tmp/keeper-converter/bin/python recognition/scripts/convert_ocr.py
      - run: python recognition/scripts/source_bundle.py
      - run: docker build -t keeper-recognition recognition
      - run: docker run --rm --network none --read-only --tmpfs /tmp:rw,size=512m --entrypoint python keeper-recognition smoke.py | tee recognition/smoke-linux.json
      - run: test -s recognition/smoke-linux.json
      - name: Verify the same image through its SageMaker HTTP entrypoint
        run: |
          docker run -d --name keeper-sagemaker-smoke --network none --read-only --tmpfs /tmp:rw,size=512m keeper-recognition serve
          docker exec keeper-sagemaker-smoke python sagemaker_smoke.py | tee recognition/sagemaker-smoke.json
          docker logs keeper-sagemaker-smoke > recognition/sagemaker-container.log
          docker stop keeper-sagemaker-smoke
      - run: docker image inspect keeper-recognition --format '{{json .}}' > recognition/image-linux.json
      - run: docker run --rm --network none --entrypoint pip keeper-recognition freeze > recognition/requirements-linux-observed.txt
      - run: docker save keeper-recognition | gzip > recognition/image.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recognition-verification
          retention-days: 7
          path: |
            recognition/smoke-linux.json
            recognition/sagemaker-smoke.json
            recognition/sagemaker-container.log
            recognition/requirements-linux-observed.txt
            recognition/source.zip
            recognition/image-linux.json
            recognition/image.tar.gz
            recognition/artifacts/ocr-onnx.json
            recognition/artifacts/ocr-onnx/
